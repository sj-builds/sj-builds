name: Generate Snake

on:
schedule:
- cron: "0 */6 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
generate:
runs-on: ubuntu-latest

steps:
  - name: Generate contribution snake
    uses: Platane/snk@v3
    with:
      github_user_name: sj-builds
      outputs: |
        dist/github-contribution-grid-snake.svg
        dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00F7FF&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353

  - name: Deploy to output branch
    uses: crazy-max/ghaction-github-pages@v3
    with:
      target_branch: output
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
