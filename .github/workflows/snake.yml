# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║           GitHub Contribution Snake — Production Workflow                  ║
# ║           User       : sj-builds                                           ║
# ║           Generator  : Platane/snk@v3                                      ║
# ║           Outputs    : github-contribution-grid-snake.svg        (light)   ║
# ║                        github-contribution-grid-snake-dark.svg   (dark)    ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: 🐍 Generate Contribution Snake

# ──────────────────────────────────────────────────────────────────────────────
# Triggers
#   • schedule          — regenerates every hour (UTC)
#   • push              — regenerates immediately on push to main / master
#   • workflow_dispatch — one-click manual run from the Actions tab
# ──────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: "0 * * * *"

  push:
    branches:
      - main
      - master

  workflow_dispatch:

# ──────────────────────────────────────────────────────────────────────────────
# Concurrency: cancel any in-progress run for the same ref so we always
# publish the most up-to-date graph state.
# ──────────────────────────────────────────────────────────────────────────────
concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────────────────────────
# Least-privilege permissions — only write access to repository contents.
# ──────────────────────────────────────────────────────────────────────────────
permissions:
  contents: write

# ──────────────────────────────────────────────────────────────────────────────
# Node.js 24 opt-in (job-level env)
#   actions/checkout and crazy-max/ghaction-github-pages currently bundle
#   Node.js 20 internally. GitHub will force Node 24 as the default on
#   June 16 2026 and remove Node 20 on September 16 2026.
#   Setting FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true opts in now so the
#   warning is silenced and the workflow is future-proof.
#   Reference: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
# ──────────────────────────────────────────────────────────────────────────────
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-snake:
    name: Generate & Publish Snake SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ────────────────────────────────────────────────────────────────────────
      # 1. Checkout — shallow clone; we only need the workflow file itself.
      # ────────────────────────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      # ────────────────────────────────────────────────────────────────────────
      # 2. Generate BOTH SVGs in a single Platane/snk@v3 call.
      #
      #    Color customisation for snk@v3 is done via query-string parameters
      #    on each output path — NOT as separate `with:` keys.
      #
      #    Light : GitHub default greens, white/grey background
      #    Dark  : built-in "github-dark" named palette (matches GitHub UI)
      # ────────────────────────────────────────────────────────────────────────
      - name: 🐍 Generate snake SVGs (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: sj-builds
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ────────────────────────────────────────────────────────────────────────
      # 3. Verify — fail fast if either SVG is missing or suspiciously small.
      # ────────────────────────────────────────────────────────────────────────
      - name: ✅ Verify generated SVGs
        shell: bash
        run: |
          set -euo pipefail

          check_svg() {
            local file="$1"
            if [[ ! -f "$file" ]]; then
              echo "::error::Expected SVG not found: $file"
              exit 1
            fi
            local size
            size=$(stat -c%s "$file")
            if [[ "$size" -lt 512 ]]; then
              echo "::error::SVG appears empty or corrupt (${size} bytes): $file"
              exit 1
            fi
            echo "::notice::✔ $file — ${size} bytes"
          }

          check_svg dist/github-contribution-grid-snake.svg
          check_svg dist/github-contribution-grid-snake-dark.svg

      # ────────────────────────────────────────────────────────────────────────
      # 4. Publish — push both SVGs to an orphan `output` branch.
      #    keep_history: false  → force-push a single-commit snapshot.
      # ────────────────────────────────────────────────────────────────────────
      - name: 🚀 Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          allow_empty_commit: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ────────────────────────────────────────────────────────────────────────
      # 5. Job summary — ready-to-paste README snippets after each run.
      # ────────────────────────────────────────────────────────────────────────
      - name: 📋 Write job summary
        if: success()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## 🐍 Snake SVGs published successfully

          Paste **one** of the snippets below into your `README.md`:

          ### Auto-switching light/dark (recommended)
          ```md
          <picture>
            <source
              media="(prefers-color-scheme: dark)"
              srcset="https://raw.githubusercontent.com/sj-builds/sj-builds/output/github-contribution-grid-snake-dark.svg"
            />
            <img
              alt="GitHub contribution snake"
              src="https://raw.githubusercontent.com/sj-builds/sj-builds/output/github-contribution-grid-snake.svg"
            />
          </picture>
          ```

          ### Light only
          ```md
          ![snake](https://raw.githubusercontent.com/sj-builds/sj-builds/output/github-contribution-grid-snake.svg)
          ```

          ### Dark only
          ```md
          ![snake](https://raw.githubusercontent.com/sj-builds/sj-builds/output/github-contribution-grid-snake-dark.svg)
          ```
          EOF
